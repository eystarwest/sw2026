name: API Test Automation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  path-coverage-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run the API in background
        run: npm start &

      - name: Wait until the API is running
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/healthcheck; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API to start... ($i/30)"
            sleep 1
          done
          echo "API did not start in time"
          exit 1

      - name: Run test scripts
        run: npm test
